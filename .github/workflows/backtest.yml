name: Run Backtest (manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: true
        default: "2022-01-01"
      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: true
        default: "2024-12-31"
      max_positions:
        description: "Max concurrent positions"
        required: false
        default: "10"
      cost_bps:
        description: "Round-trip cost in bps per rebalance (0 = ignore costs)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: >
          python backtest_stage2.py
          --start ${{ github.event.inputs.start_date }}
          --end ${{ github.event.inputs.end_date }}
          --max-positions ${{ github.event.inputs.max_positions }}
          --cost-bps ${{ github.event.inputs.cost_bps }}

      - name: Commit and push backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest_report.html docs/backtest_results.json
          git diff --staged --quiet || git commit -m "Backtest run: ${{ github.event.inputs.start_date }} to ${{ github.event.inputs.end_date }}"
          git push
